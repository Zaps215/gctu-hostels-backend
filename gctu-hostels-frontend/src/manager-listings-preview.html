<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preview My Hostels | GCTU StudentHostels</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --ink: #183044; --muted: #687b89; --blue: #2b5f8a; --teal: #1f8a7c; --gold: #f4a261; --line: #e5ebee; }
        * { box-sizing: border-box; }
        body { margin: 0; background: #f3f6f7; color: var(--ink); font-family: Inter, sans-serif; }
        header { background: white; border-bottom: 1px solid var(--line); }
        .nav, main { width: min(1120px, calc(100% - 40px)); margin: auto; }
        .nav { min-height: 72px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
        .brand { color: var(--blue); font-size: 19px; font-weight: 800; text-decoration: none; }
        .brand span { color: var(--gold); }
        .nav-actions { display: flex; align-items: center; gap: 18px; }
        a { color: var(--blue); }
        button, .button { border: 0; border-radius: 10px; background: var(--blue); color: white; font: inherit; font-weight: 700; padding: 11px 16px; text-decoration: none; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
        button:disabled { opacity: .6; cursor: wait; }
        .button.secondary { color: var(--blue); background: #eaf1f5; }
        main { padding: 38px 0 64px; }
        .page-heading { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 25px; }
        h1 { margin: 0 0 8px; font-size: clamp(26px, 4vw, 36px); }
        h2, h3, p { margin-top: 0; }
        .subtitle, .muted { color: var(--muted); }
        .subtitle { margin-bottom: 0; }
        .listing-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 22px; }
        .listing-card { overflow: hidden; background: white; border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 8px 26px rgba(24,48,68,.06); }
        .cover { display: block; width: 100%; height: 190px; object-fit: cover; background: #eaf1f5; }
        .card-content { padding: 18px; }
        .card-title { display: flex; justify-content: space-between; align-items: start; gap: 12px; }
        .card-title h2 { margin: 0; font-size: 19px; line-height: 1.35; }
        .price { color: var(--teal); white-space: nowrap; font-size: 14px; font-weight: 800; }
        .location { color: var(--muted); font-size: 14px; margin: 9px 0 14px; }
        .amenities { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 16px; }
        .amenity { border-radius: 99px; padding: 6px 9px; background: #edf5f2; color: #176957; font-size: 12px; }
        .badge { display: inline-block; border-radius: 99px; padding: 6px 10px; background: #e5f4ed; color: #176957; font-size: 12px; font-weight: 700; }
        .badge.unavailable { background: #fff0e4; color: #8a4c26; }
        .details { border-top: 1px solid var(--line); padding-top: 14px; }
        .details summary { color: var(--blue); cursor: pointer; font-size: 14px; font-weight: 700; }
        .details-copy { padding-top: 13px; font-size: 14px; line-height: 1.6; overflow-wrap: anywhere; }
        .details-copy p { margin: 0 0 9px; }
        .card-actions { display: flex; gap: 9px; margin-top: 16px; }
        .card-actions > * { flex: 1; }
        #status { margin: 20px 0; color: var(--muted); }
        .empty { grid-column: 1 / -1; text-align: center; background: white; padding: 48px 20px; border: 1px solid var(--line); border-radius: 16px; }
        @media (max-width: 600px) {
            .nav, main { width: min(100% - 28px, 1120px); }
            .page-heading { align-items: start; flex-direction: column; }
            .nav-actions { gap: 10px; }
            .listing-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <header>
        <nav class="nav">
            <a class="brand" href="manager-dashboard.html">GCTU<span> StudentHostels</span></a>
            <div class="nav-actions">
                <a href="manager-dashboard.html">Manager dashboard</a>
                <button id="logoutButton" class="button secondary" type="button">Log out</button>
            </div>
        </nav>
    </header>
    <main>
        <section class="page-heading">
            <div>
                <h1>Preview my hostels</h1>
                <p class="subtitle">This page shows only listings you manage, in the same style students use to browse hostels.</p>
            </div>
            <a class="button" href="add-hostel.html">+ Add a hostel</a>
        </section>
        <p id="status" role="status">Loading your hostel previews…</p>
        <section id="listingGrid" class="listing-grid" aria-label="Your hostel previews"></section>
    </main>
    <script src="config.js"></script>
    <script>
        const grid = document.getElementById('listingGrid');
        const status = document.getElementById('status');
        const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, char => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        })[char]);

        function safeImageUrl(value) {
            try {
                const url = new URL(value);
                return ['http:', 'https:'].includes(url.protocol) ? url.href : '';
            } catch {
                return '';
            }
        }

        async function verifyManager() {
            const response = await fetch(`${API_CONFIG.AUTH_API}/me`, { credentials: 'include', cache: 'no-store' });
            if (!response.ok) {
                window.location.replace('login.html?role=manager');
                return false;
            }
            const { user } = await response.json();
            if (user?.role !== 'manager') {
                window.location.replace(user?.role === 'student' ? 'dashboard.html' : 'login.html?role=manager');
                return false;
            }
            return true;
        }

        function renderListings(hostels) {
            grid.replaceChildren();
            if (hostels.length === 0) {
                status.hidden = true;
                grid.innerHTML = '<div class="empty"><h2>No hostels to preview yet</h2><p class="muted">Add a listing and it will appear here and on the student browsing pages.</p><a class="button" href="add-hostel.html">Add a hostel</a></div>';
                return;
            }

            status.hidden = true;
            hostels.forEach(hostel => {
                const card = document.createElement('article');
                card.className = 'listing-card';
                const available = hostel.isAvailable !== false;
                const amenities = Array.isArray(hostel.amenities) ? hostel.amenities : [];
                const imageUrl = safeImageUrl(hostel.coverImage);
                card.innerHTML = `
                    <img class="cover" src="${escapeHtml(imageUrl)}" alt="${escapeHtml(hostel.name)}" loading="lazy">
                    <div class="card-content">
                        <div class="card-title">
                            <h2>${escapeHtml(hostel.name)}</h2>
                            <span class="price">GHS ${Number(hostel.price).toLocaleString()}</span>
                        </div>
                        <p class="location">${escapeHtml(hostel.location)} · ${escapeHtml(hostel.distanceFromCampus || 'Walking distance')}</p>
                        <div class="amenities">
                            ${amenities.slice(0, 4).map(amenity => `<span class="amenity">${escapeHtml(amenity)}</span>`).join('')}
                        </div>
                        <p><span class="badge ${available ? '' : 'unavailable'}">${available ? 'Available' : 'Unavailable'}</span></p>
                        <details class="details">
                            <summary>Preview full listing</summary>
                            <div class="details-copy">
                                <p>${escapeHtml(hostel.description || 'No description provided.')}</p>
                                <p><strong>Payment:</strong> ${escapeHtml(hostel.paymentTerm || 'Not specified')}</p>
                                <p><strong>Contact:</strong> ${escapeHtml(hostel.contactPhone || 'Not provided')}</p>
                            </div>
                        </details>
                        <div class="card-actions">
                            <a class="button secondary" href="add-hostel.html?edit=${encodeURIComponent(hostel._id)}">Edit listing</a>
                            <a class="button" href="manager-dashboard.html">Manage</a>
                        </div>
                    </div>`;
                grid.append(card);
            });
        }

        let refreshInProgress = false;
        async function loadListings({ quiet = false } = {}) {
            if (refreshInProgress) return;
            refreshInProgress = true;
            if (!quiet) {
                status.hidden = false;
                status.textContent = 'Loading your hostel previews…';
            }
            try {
                const response = await fetch(`${API_CONFIG.HOSTEL_API}/mine`, {
                    credentials: 'include',
                    cache: 'no-store'
                });
                const result = await response.json();
                if (!response.ok || !result.success) throw new Error(result.error || 'Unable to load your hostel listings.');
                renderListings(result.data);
            } catch (error) {
                console.error('Unable to load manager hostel previews:', error);
                if (!quiet) {
                    status.hidden = false;
                    status.textContent = error.message || 'Unable to load your hostel listings.';
                }
            } finally {
                refreshInProgress = false;
            }
        }

        document.getElementById('logoutButton').addEventListener('click', async () => {
            try {
                await fetch(`${API_CONFIG.AUTH_API}/logout`, { method: 'POST', credentials: 'include' });
            } finally {
                window.location.replace('login.html?role=manager');
            }
        });

        verifyManager().then(isManager => {
            if (!isManager) return;
            loadListings();
            window.setInterval(() => {
                if (document.visibilityState === 'visible') loadListings({ quiet: true });
            }, 30000);
        }).catch(error => {
            console.error('Manager session check failed:', error);
            window.location.replace('login.html?role=manager');
        });
    </script>
</body>
</html>
